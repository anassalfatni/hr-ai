services:
  api:
    build: .
    ports: ["5000:5000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
